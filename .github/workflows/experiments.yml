name: Experiments

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/**"
      - ".github/workflows/experiments.yml"
  push:
    branches: [main]
    paths:
      - "experiments/**"
      - ".github/workflows/experiments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics:
    name: Mechanics checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the experiment package
        run: python -m pip install ./experiments
      - name: Verify the mechanics identities
        run: python -m ainos_experiments.verify_identities
