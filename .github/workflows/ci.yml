name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handbook:
    name: Handbook tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test Markdown staging and HTML links
        run: PYTHONPATH=docs python -m unittest discover -s docs/tests -v
  lean:
    name: Lean build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit. Keep the first
          # parent as well, so the files the pull request changes can be listed.
          fetch-depth: 2
      - name: Detect whether the change can affect Lean
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        # Pushes to main always run the Lean steps: they verify main and warm
        # the build cache that pull requests restore. A pull request skips them
        # only when it changes no Lean source, check, toolchain, manifest or
        # this workflow. If the changed files cannot be listed, the steps run.
        run: |
          lean=true
          if [ "$EVENT_NAME" = pull_request ]; then
            if changed=$(git diff --name-only HEAD^1 HEAD); then
              pattern='\.lean$|^lakefile\.toml$|^lake-manifest\.json$|^lean-toolchain$|^checks/|^\.github/workflows/ci\.yml$'
              if ! printf '%s\n' "$changed" | grep -qE "$pattern"; then
                lean=false
              fi
            fi
          fi
          echo "lean=$lean" >> "$GITHUB_OUTPUT"
          echo "Lean steps required: $lean"
      - name: Build and audit Lean
        if: steps.scope.outputs.lean == 'true'
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        env:
          # This lean-action revision otherwise exports a fixed flat cache URL.
          # Its get-cache step unsets an explicitly empty value, allowing the
          # pinned Mathlib client to select its own default cache routing.
          MATHLIB_CACHE_GET_URL: ""
        with:
          build: "true"
          build-args: --wfail ProjectAInos
          use-mathlib-cache: "true"
          # Run inside the action, before it saves the build cache, so the
          # linked mk_all executable is cached and not rebuilt on every run.
          mk_all-check: "true"
          mk_all-args: --lib ProjectAInos
          axiom-audit: "true"
          axiom-audit-root: ProjectAInos
          axiom-audit-allow: propext,Classical.choice,Quot.sound
      - name: Run the import-boundary, API and axiom checks
        if: steps.scope.outputs.lean == 'true'
        # Every file in checks/ runs in parallel; a new check needs no step here.
        run: checks/run.sh
