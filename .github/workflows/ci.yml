name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and audit Lean
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        env:
          # This lean-action revision otherwise exports a fixed flat cache URL.
          # Its get-cache step unsets an explicitly empty value, allowing the
          # pinned Mathlib client to select its own default cache routing.
          MATHLIB_CACHE_GET_URL: ""
        with:
          build: "true"
          build-args: --wfail ProjectAInos
          use-mathlib-cache: "true"
          axiom-audit: "true"
          axiom-audit-root: ProjectAInos
          axiom-audit-allow: propext,Classical.choice,Quot.sound
      - name: Check the root module imports
        run: lake exe mk_all --check --lib ProjectAInos
      - name: Check the smooth geometry API
        run: lake env lean -DwarningAsError=true checks/SmoothGeometryAPI.lean
      - name: Check the Lorentz geometry API
        run: lake env lean -DwarningAsError=true checks/LorentzGeometryAPI.lean
      - name: Check the imported Yang--Mills API
        run: lake env lean -DwarningAsError=true checks/YangMillsImportAPI.lean
      - name: Check the special relativity API
        run: lake env lean -DwarningAsError=true checks/SpecialRelativityAPI.lean
      - name: Check the general relativity API
        run: lake env lean -DwarningAsError=true checks/GeneralRelativityAPI.lean
      - name: Check the canonical atomic process API
        run: lake env lean -DwarningAsError=true checks/AtomicNonreactiveAPI.lean
      - name: Check the electrodynamics API
        run: lake env lean -DwarningAsError=true checks/ElectrodynamicsAPI.lean
      - name: Check the quantum mechanics API and axiom dependencies
        run: lake env lean -DwarningAsError=true checks/QuantumMechanicsAPI.lean
      - name: Audit project and imported YM declarations transitively
        run: lake env lean -DwarningAsError=true checks/AxiomAudit.lean
