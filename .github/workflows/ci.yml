name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handbook:
    name: Handbook tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test Markdown staging and HTML links
        run: PYTHONPATH=docs python -m unittest discover -s docs/tests -v
  lean-scope:
    name: Detect Lean changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit. Keep the first
          # parent as well, so the files the pull request changes can be listed.
          fetch-depth: 2
      - name: Detect whether the change can affect Lean
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        # Pushes to main always run the Lean steps: they verify main and warm
        # the build cache that pull requests restore. A pull request skips them
        # only when it changes no Lean source, check, toolchain, manifest or
        # this workflow. If Git cannot compare the revisions, the steps run.
        # Rename detection is off, so Git also checks the source path of a move.
        run: |
          lean=true
          if [ "$EVENT_NAME" = pull_request ]; then
            if git diff --quiet --no-renames HEAD^1 HEAD -- ':(glob)**/*.lean' \
                lakefile.toml lake-manifest.json lean-toolchain checks/ \
                .github/workflows/ci.yml .github/actions/lean-setup/; then
              lean=false
            fi
          fi
          echo "required=$lean" >> "$GITHUB_OUTPUT"
          echo "Lean steps required: $lean"

  lean-subject:
    name: Lean (${{ matrix.name }})
    needs: lean-scope
    # The three subject jobs are required status checks. A matrix job that is
    # skipped as a whole reports one check under its unexpanded name, and the
    # required names never report. So each job always runs, and its steps are
    # skipped when the change cannot affect Lean.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: thermodynamics
            name: Thermodynamics
          - subject: mechanics
            name: Mechanics
          - subject: classical-fields
            name: Classical field theory
    steps:
      - name: Report whether the Lean steps run
        env:
          LEAN_REQUIRED: ${{ needs.lean-scope.outputs.required }}
        run: |
          echo "Lean steps required: $LEAN_REQUIRED"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.lean-scope.outputs.required == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/lean-setup
        if: needs.lean-scope.outputs.required == 'true'
        with:
          save-dependencies: ${{ matrix.subject == 'classical-fields' && 'true' || 'false' }}
      - name: Restore subject build cache
        if: needs.lean-scope.outputs.required == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ matrix.subject }}-${{ github.sha }}
          restore-keys: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ matrix.subject }}-
      - name: Build and check the subject
        if: needs.lean-scope.outputs.required == 'true'
        env:
          LEAN_SUBJECT: ${{ matrix.subject }}
        run: python3 checks/ci.py "$LEAN_SUBJECT" "$RUNNER_TEMP/$LEAN_SUBJECT.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.lean-scope.outputs.required == 'true'
        with:
          name: lean-objects-${{ matrix.subject }}
          path: ${{ runner.temp }}/${{ matrix.subject }}.tar
          if-no-files-found: error
          overwrite: true

  lean:
    name: Lean build
    needs: [lean-scope, lean-subject]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the subject results
        env:
          SCOPE_RESULT: ${{ needs.lean-scope.result }}
          SUBJECT_RESULT: ${{ needs.lean-subject.result }}
        # The subject jobs succeed in both cases: after building their
        # subject, or after skipping their steps.
        run: |
          echo "Scope: $SCOPE_RESULT. Subjects: $SUBJECT_RESULT."
          test "$SCOPE_RESULT" = success
          test "$SUBJECT_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.lean-scope.outputs.required == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/lean-setup
        if: needs.lean-scope.outputs.required == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.lean-scope.outputs.required == 'true'
        with:
          pattern: lean-objects-*
          path: ${{ runner.temp }}/lean-objects
          merge-multiple: true
      - name: Check root imports, shared boundaries and axioms
        if: needs.lean-scope.outputs.required == 'true'
        run: python3 checks/ci.py integration "$RUNNER_TEMP/lean-objects"
