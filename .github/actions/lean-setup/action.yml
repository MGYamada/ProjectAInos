name: Set up Lean and Mathlib
description: Restore shared Lean dependencies and install the pinned toolchain.
inputs:
  save-dependencies:
    description: Save the shared dependency cache when it is missing.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Restore dependencies
      id: dependencies
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .lake/packages
        key: lean-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
    - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
      env:
        # Let the pinned Mathlib cache client choose its own URL.
        MATHLIB_CACHE_GET_URL: ''
      with:
        auto-config: 'false'
        build: 'false'
        use-github-cache: 'false'
        use-mathlib-cache: 'true'
    - name: Save dependencies
      if: inputs.save-dependencies == 'true' && steps.dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .lake/packages
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
