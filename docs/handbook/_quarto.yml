project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"

website:
  title: "P⊗AI (Project Ainos)"
  search: true
  navbar:
    right:
      - text: Lean API
        href: api/index.html
  sidebar:
    style: docked
    contents:
      - index.qmd
      - research-plan.qmd
      - proof-development.qmd
      - courant-hilbert.qmd
      - section: Thermodynamics
        contents:
          - thermodynamics.qmd
          - thermodynamics-algebra.qmd
          - thermodynamics-models.qmd
          - thermodynamics-physical.qmd
          - thermodynamics-notes.qmd
          - thermodynamics-status.qmd
          - thermodynamics-join-audit.qmd
      - section: Shared smooth geometry
        contents:
          - shared-smooth-algebra-and-geometry.qmd
          - smooth-algebra.qmd
          - smooth-geometry.qmd
          - smooth-geometry-notes.qmd
      - section: Shared variational calculus
        contents:
          - variational.qmd
          - variational-notes.qmd
      - section: Mechanics
        contents:
          - mechanics.qmd
          - cinfty-mechanics.qmd
          - mechanics-notes.qmd
          - mechanics-experiments.qmd
          - landau-lifshitz.qmd
      - section: Relativity and electrodynamics
        contents:
          - cinfty-special-relativity.qmd
          - special-relativity.qmd
          - special-relativity-notes.qmd
          - cinfty-electrodynamics.qmd
          - electrodynamics.qmd
          - electrodynamics-notes.qmd
          - cinfty-general-relativity.qmd
          - general-relativity.qmd
          - general-relativity-notes.qmd
      - section: Quantum prototypes
        contents:
          - quantum-mechanics-prototype.qmd
          - quantum-field-theory-prototype.qmd
      - build.qmd

format:
  html:
    toc: true
    html-math-method: mathjax
from: markdown+gfm_auto_identifiers
filters:
  - links.lua
