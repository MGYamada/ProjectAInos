[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ainos-experiments"
version = "0.1.0"
description = "Symbolic and numerical experiments for Project AInos"
requires-python = ">=3.12"
dependencies = ["sympy==1.14.0"]

[tool.setuptools]
packages = ["ainos_experiments"]
