[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ainos-experiments"
version = "0.1.0"
description = "Symbolic and numerical experiments for Project AInos"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["sympy==1.14.0", "mpmath==1.3.0"]

[tool.setuptools]
packages = ["ainos_experiments"]
